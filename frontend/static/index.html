<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cell Tracking Software</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <div class="controls">
      <h2>Control Center</h2>

      <label>
        Upload file
        <input type="file" id="fileInput" 
        accept = ".tif,.tiff"/>
      </label>

      <button id="runBtn">Upload</button>

      <p id="status">File Status</p>
    </div>

    <div class="output">
      <h2>Output</h2>
      <img id="resultImage" />
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
