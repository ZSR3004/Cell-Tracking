<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cell Tracking Software</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <div class="controls">
      <h2>Control Center</h2>

      <label>
        Upload file
        <input type="file" id="fileInput" 
        accept = ".tif,.tiff"/>
      </label>
      <!-- setup for pre-processing-->
      <div class="control-box">
        <h3>Preprocessing</h3>

        <div class="param-group">
          <h4>Gaussian Blur</h4>
          <div class="param">
            <label>Kernel size</label>
            <input type="number" id="gaussK" value="5" step="2" min="1" />
          </div>
          <div class="param">
            <label>Sigma X</label>
            <input type="number" id="gaussSigma" value="1.5" step="0.1" />
          </div>
        </div>

        <div class="param-group">
          <h4>Median Filter</h4>
          <div class="param">
            <label>Kernel size</label>
            <input type="number" id="medianK" value="5" step="2" min="1" />
          </div>
        </div>

        <div class="param-group">
          <h4>Contrast Adjustment</h4>
          <div class="param">
            <label>Alpha</label>
            <input type="number" id="contrastAlpha" value="1.0" step="0.1" />
          </div>
          <div class="param">
            <label>Beta</label>
            <input type="number" id="contrastBeta" value="0.0" step="0.1" />
          </div>
        </div>
      </div>

      <!-- setup for Farneback-->
      <div class="control-box">
        <h3>Farneback Optical Flow</h3>

        <div class="param-group">
          <div class="param">
            <label>Pyramid Scale</label>
            <input type="number" id="fbPyrScale" value="0.5" step="0.1" />
          </div>
          <div class="param">
            <label>Levels</label>
            <input type="number" id="fbLevels" value="3" min="1" />
          </div>
          <div class="param">
            <label>Window Size</label>
            <input type="number" id="fbWinSize" value="15" min="1" />
          </div>
          <div class="param">
            <label>Iterations</label>
            <input type="number" id="fbIterations" value="3" min="1" />
          </div>
          <div class="param">
            <label>Polynomial N</label>
            <input type="number" id="fbPolyN" value="5" step="2" min="1" />
          </div>
          <div class="param">
            <label>Polynomial Sigma</label>
            <input type="number" id="fbPolySigma" value="1.2" step="0.1" />
          </div>
        </div>
      </div>

      <button id="runBtn">Upload</button>

      <p id="status">File Status</p>
    </div>

    <div class="output">
      <h2>Output</h2>
      <img id="resultImage" />
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
